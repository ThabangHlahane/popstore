<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title th:text="${title}">Shoe</title>
</head>
<body>
<div class="container" style="max-width: 640px">
    <h1 class="text-center my-4" th:text="${title}">New Shoe</h1>

    <!-- enctype="multipart/form-data" is required, or the picture won't upload -->
    <form th:action="${action}" th:object="${productDto}" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Brand</label>
                <input type="text" class="form-control" th:field="*{brand}">
                <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" th:field="*{category}" list="categories">
                <datalist id="categories">
                    <option value="Sneakers"></option>
                    <option value="Sandals"></option>
                    <option value="Slides"></option>
                </datalist>
                <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Price (R)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}">
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Image</label>

            <!-- On the Edit page, show the picture the shoe has now -->
            <div th:if="${currentImage != null}" class="mb-2">
                <img th:src="@{/products/images/{file}(file=${currentImage})}" width="120" class="img-thumbnail" alt="Current image">
                <div class="form-text">Choose a new file only if you want to replace this picture.</div>
            </div>

            <!-- File picker: opens the file chooser on your computer -->
            <input type="file" class="form-control" th:field="*{imageFile}" accept="image/*">
            <div class="text-danger" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
        </div>

        <div class="d-flex gap-2 mb-5">
            <!-- SAVE button: sends the form (and the picture) to the controller -->
            <button type="submit" class="btn btn-success">Save</button>
            <!-- CANCEL button: goes back to the list without saving -->
            <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
